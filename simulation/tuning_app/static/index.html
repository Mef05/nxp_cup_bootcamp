<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NXP Cup Tuning Dashboard</title>
<style>
    :root {
        --bg-color: #1a1a2e;
        --panel-bg: #16213e;
        --accent: #0f3460;
        --highlight: #e94560;
        --text: #e0e0e0;
        --text-muted: #888;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    .topbar {
        background-color: var(--panel-bg);
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--accent);
    }
    .topbar h1 {
        margin: 0;
        font-size: 1.2rem;
        color: var(--highlight);
    }
    .btn {
        background-color: var(--accent);
        color: var(--text);
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .btn:hover {
        background-color: #1a5192;
    }
    .btn.primary {
        background-color: var(--highlight);
    }
    .btn.primary:hover {
        background-color: #ff5c77;
    }
    .main-grid {
        display: grid;
        grid-template-columns: 300px 1fr 300px;
        gap: 20px;
        padding: 20px;
        flex-grow: 1;
        overflow: hidden;
    }
    .panel {
        background-color: var(--panel-bg);
        border-radius: 8px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }
    h2 {
        margin-top: 0;
        font-size: 1.1rem;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 10px;
    }
    .slider-group {
        margin-bottom: 15px;
    }
    .slider-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
        font-size: 0.9rem;
    }
    .slider-header span:last-child {
        color: var(--highlight);
        font-weight: bold;
    }
    input[type=range] {
        width: 100%;
        accent-color: var(--highlight);
    }
    .canvas-container {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0d0d1a;
        border-radius: 8px;
        overflow: hidden;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
    }
    .metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
    }
    .metric-box {
        background-color: var(--accent);
        padding: 10px;
        border-radius: 4px;
        text-align: center;
    }
    .metric-box .label {
        font-size: 0.8rem;
        color: var(--text-muted);
    }
    .metric-box .val {
        font-size: 1.2rem;
        font-weight: bold;
    }
    .ai-log {
        flex-grow: 1;
        background-color: #0d0d1a;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.85rem;
        overflow-y: auto;
        color: #aaa;
    }
    .ai-log .msg { margin-bottom: 5px; }
    .ai-log .ai-action { color: #44ff88; }
</style>
</head>
<body>

<div class="topbar">
    <h1>NXP Cup Tuning</h1>
    <div>
        <button class="btn" onclick="fetchConfig()">Load</button>
        <button class="btn" onclick="resetConfig()">Reset Defaults</button>
    </div>
</div>

<div class="main-grid">
    <!-- LEFT PANEL: Sliders -->
    <div class="panel" id="controls">
        <h2>Parameters</h2>
        <!-- Generated by JS -->
    </div>

    <!-- CENTER PANEL: Track Map -->
    <div class="panel" style="padding:0;">
        <div class="canvas-container" id="canvas-container">
            <canvas id="trackCanvas"></canvas>
        </div>
    </div>

    <!-- RIGHT PANEL: Metrics & AI -->
    <div class="panel">
        <h2>Metrics & Control</h2>
        <div class="metrics">
            <div class="metric-box">
                <div class="label">Score</div>
                <div class="val" id="m-score">-</div>
            </div>
            <div class="metric-box">
                <div class="label">Max CTE (px)</div>
                <div class="val" id="m-max-cte">-</div>
            </div>
            <div class="metric-box">
                <div class="label">Mean CTE (px)</div>
                <div class="val" id="m-mean-cte">-</div>
            </div>
            <div class="metric-box">
                <div class="label">Off Track</div>
                <div class="val" id="m-off-track">-</div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn primary" style="flex: 1;" onclick="runSim()">Run Simulation</button>
            <button class="btn primary" style="flex: 1; background-color: #8a2be2;" onclick="startAI()">Ask AI to Tune</button>
        </div>
        
        <h2>AI Agent Log</h2>
        <div class="ai-log" id="aiLog">
            <div class="msg">Ready.</div>
        </div>
    </div>
</div>

<script>
    const params = [
        {id: 'STEER_KP', min: 0.0, max: 15.0, step: 0.1},
        {id: 'STEER_KP_Q', min: 0.0, max: 1.0, step: 0.01},
        {id: 'STEER_KD', min: 0.0, max: 2.0, step: 0.01},
        {id: 'STEERING_ALPHA', min: 0.0, max: 1.0, step: 0.01},
        {id: 'LOOKAHEAD_FACTOR', min: 0.0, max: 1.0, step: 0.01},
        {id: 'HEADING_FACTOR', min: 0.0, max: 1.0, step: 0.01},
        {id: 'DIFFERENTIAL_FACTOR', min: 0.0, max: 1.0, step: 0.01},
        {id: 'MIN_BOT_Y', min: 0, max: 51, step: 1},
        {id: 'MIN_STEER_SCALE', min: 0.0, max: 1.0, step: 0.01},
        {id: 'SPEED_RIGHT', min: 0, max: 100, step: 1},
        {id: 'SPEED_LEFT', min: 0, max: 100, step: 1}
    ];

    let currentConfig = {};
    const controlsDiv = document.getElementById('controls');

    // Build sliders
    params.forEach(p => {
        const div = document.createElement('div');
        div.className = 'slider-group';
        div.innerHTML = `
            <div class="slider-header">
                <span>${p.id}</span>
                <span id="val-${p.id}">0</span>
            </div>
            <input type="range" id="input-${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" 
                   oninput="updateValue('${p.id}', this.value)" onchange="sendConfig('${p.id}', this.value)">
        `;
        controlsDiv.appendChild(div);
    });

    function updateValue(id, val) {
        document.getElementById(`val-${id}`).innerText = val;
    }

    async function fetchConfig() {
        const r = await fetch('/config');
        currentConfig = await r.json();
        params.forEach(p => {
            if (currentConfig[p.id] !== undefined) {
                const v = currentConfig[p.id];
                document.getElementById(`input-${p.id}`).value = v;
                updateValue(p.id, v);
            }
        });
    }

    async function sendConfig(id, val) {
        const update = {};
        update[id] = parseFloat(val);
        await fetch('/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(update)
        });
    }

    async function resetConfig() {
        await fetch('/config/reset', { method: 'POST' });
        fetchConfig();
    }

    // Canvas rendering
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    let trackData = null;
    let carState = null;

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        drawTrack();
    }
    window.addEventListener('resize', resizeCanvas);

    async function loadTrack() {
        const r = await fetch('/track');
        trackData = await r.json();
        resizeCanvas();
    }

    function drawTrack() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!trackData) return;

        // Find bounds
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        const allPoints = [...trackData.left, ...trackData.right, ...trackData.center];
        allPoints.forEach(p => {
            if (p[0] < minX) minX = p[0];
            if (p[0] > maxX) maxX = p[0];
            if (p[1] < minY) minY = p[1];
            if (p[1] > maxY) maxY = p[1];
        });

        // Adding padding
        minX -= 1; maxX += 1;
        minY -= 1; maxY += 1;

        const w = maxX - minX;
        const h = maxY - minY;
        const scale = Math.min(canvas.width / w, canvas.height / h);
        const offsetX = (canvas.width - w * scale) / 2 - minX * scale;
        const offsetY = (canvas.height - h * scale) / 2 - minY * scale;

        function toScreen(x, y) {
            return [x * scale + offsetX, y * scale + offsetY];
        }

        function drawLine(points, color, width) {
            if (!points || points.length === 0) return;
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            const start = toScreen(points[0][0], points[0][1]);
            ctx.moveTo(start[0], start[1]);
            for (let i = 1; i < points.length; i++) {
                const pt = toScreen(points[i][0], points[i][1]);
                ctx.lineTo(pt[0], pt[1]);
            }
            ctx.stroke();
        }

        drawLine(trackData.center, '#333355', 1);
        drawLine(trackData.left, '#2255aa', 3);
        drawLine(trackData.right, '#aa2222', 3);

        if (carState) {
            const pos = toScreen(carState.x, carState.y);
            ctx.fillStyle = '#44ff88';
            ctx.beginPath();
            ctx.arc(pos[0], pos[1], 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw heading
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pos[0], pos[1]);
            ctx.lineTo(pos[0] + Math.cos(carState.theta) * 15, pos[1] + Math.sin(carState.theta) * 15);
            ctx.stroke();
        }
    }

    // WebSocket
    const ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.onmessage = (event) => {
        carState = JSON.parse(event.data);
        drawTrack();
    };

    function logAI(msg, isAction=false) {
        const log = document.getElementById('aiLog');
        const div = document.createElement('div');
        div.className = 'msg ' + (isAction ? 'ai-action' : '');
        div.innerText = `> ${msg}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    async function runSim() {
        const r = await fetch('/simulate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({frames: 0})
        });
        const m = await r.json();
        document.getElementById('m-score').innerText = m.score ? m.score.toFixed(2) : '-';
        document.getElementById('m-max-cte').innerText = m.max_cte_px.toFixed(2);
        document.getElementById('m-mean-cte').innerText = m.mean_cte_px.toFixed(2);
        document.getElementById('m-off-track').innerText = m.off_track ? 'YES' : 'NO';
        if (m.off_track) document.getElementById('m-off-track').style.color = 'var(--highlight)';
        else document.getElementById('m-off-track').style.color = '#44ff88';
    }

    async function startAI() {
        logAI('Starting AI Tuning Agent...', true);
        const source = new EventSource('/ai/tune');
        source.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.status === 'done') {
                logAI(`Finished! Best Score: ${data.best_score.toFixed(2)}`);
                fetchConfig();
                source.close();
            } else if (data.status === 'error') {
                logAI(`Error: ${data.message}`);
                source.close();
            } else if (data.status === 'progress') {
                logAI(data.message, true);
            }
        };
    }

    // Init
    fetchConfig();
    loadTrack();
</script>
</body>
</html>
